# Capability: Blog / Documentation
# Framework: CEF · Specification: AS-015 (Runtime Engine) · Version: 1.0.0

capability: blog
version: 1.0.0

classification:
  aliases: [blog, publication, editorial site, documentation, docs site, knowledge base]
  signals:
    goal: educate-and-build-authority
    audience: public-visitor
    surfaces: many-pages
    data: content-only
    auth: none
    commerce: none
complexity_default: standard

engines:
  required:
    - architecture
    - platform
    - components
    - experience
    - motion
    - discoverability
    - content
    - assets
    - quality
    - operations
  excluded: []

skills: [taste-skill, frontend-design-skill, ui-ux-pro-max, seo-skill, nextjs-seo-skill]
mcps: [chrome-devtools-mcp, higgsfield-mcp]

legal_documents:
  - privacy-policy
  - cookie-policy
  - imprint
  optional: [terms-of-service]

assets:
  - logo-system
  - og-image
  - favicon-set
  optional: [article-imagery, illustrations]

workflow:
  project_type: PT-H            # workflow-engine/project-types.md
  states: all
  emphasis: [S04, S12, S16]     # taxonomy/IA, SEO + AI-SEO, content
  deltas: [article-author-tag-content-model, article-jsonld, rss-feed]

profiles:
  architecture: blog            # standards/architecture/project-types.md
  density: reading              # experience.policy.yaml
  motion_level: blog            # motion.policy.yaml (default 2, ceiling 3)
  page_sections: blog_article   # content.policy.yaml

# Applied when classified as documentation (runtime.policy delta).
deltas:
  documentation:
    page_sections: documentation      # content.policy.yaml
    motion_level: documentation       # motion.policy.yaml (default 1, ceiling 2)
    adds: [docs-ia, versioned-docs, code-examples]
    removes: [editorial-cadence, author-bylines-optional]

validation:
  gates: all
  emphasis: [discoverability, content, accessibility]
  release_verification: all
