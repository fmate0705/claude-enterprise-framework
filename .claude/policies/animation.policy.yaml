# Animation Policy
# Framework: CEF · Specification: AS-009 (Motion Intelligence Engine) · Version: 0.1.0
# Canonical durations, easing curves, and performance thresholds. Single source
# of truth for motion/timing.md, motion/easing.md, motion/performance.md.
# Documentation MUST match these values.

policy: animation
version: 0.1.0

# Duration bands (motion/timing.md).
durations_ms:
  fast_feedback: [100, 150]
  ui_transition: [150, 250]
  panel_transition: [250, 350]
  page_transition: [300, 500]
  hero_reveal: [500, 700]

micro_interaction_max_ms: 300      # aligns with rules/decision-engine.md DE-ANIM
recommended_max_ms: 700
absolute_max_ms: 1000
feedback_start_max_ms: 100
stagger_delay_ms: [30, 60]

# Approved easing curves (motion/easing.md).
easing:
  standard: "cubic-bezier(0.4, 0, 0.2, 1)"
  entrance: "cubic-bezier(0, 0, 0.2, 1)"     # decelerate
  exit: "cubic-bezier(0.4, 0, 1, 1)"         # accelerate
  overshoot: "cubic-bezier(0.34, 1.56, 0.64, 1)"   # restricted
  spring: physics-based-restricted
  elastic: restricted-rare
  linear: continuous-only               # spinners/progress only
rules_easing:
  approved_only: required
  standard_default: required
  entrance_decelerate: required
  exit_accelerate: required
  linear_for_discrete_ui: forbidden
  one_easing_per_interaction_type: required

# Performance thresholds (motion/performance.md).
performance:
  target_fps: 60
  frame_budget_ms: 16
  animatable_properties: [transform, opacity, filter]
  forbidden_properties: [width, height, top, left, right, bottom, margin, padding]
  layout_thrashing: forbidden
  expensive_continuous_properties: forbidden   # box-shadow, filter:blur continuous
  will_change: apply-then-remove
  measure_tool: chrome-devtools-mcp
  within_budget: required                # floor
