# Layout Policy
# Framework: CEF · Specification: AS-008 (Experience Engine) · Version: 0.1.0
# Canonical layout/grid values. Single source of truth for experience/grid.md
# and experience/layout.md. Documentation MUST match these values.

policy: layout
version: 0.1.0

max_content_width_px: 1280
max_prose_width_px: 720          # ~65ch; see typography.policy max_prose_width_ch
wide_container_px: 1440

columns:
  desktop: 12
  tablet: 8
  mobile: 4

gutter_px:
  desktop: 24
  mobile: 16

breakpoints_px:
  sm: 640
  md: 768
  lg: 1024
  xl: 1280
  "2xl": 1536

rules:
  align_to_grid: required
  reflow_not_shrink: required
  horizontal_body_overflow: forbidden
  center_everything_by_default: forbidden
  balanced_or_intentional_asymmetry: required
